name: Compatibility tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ledgerclock-labs/ledgerclock-decoder
          path: ledgerclock-decoder
      - uses: actions/checkout@v4
        with:
          repository: ledgerclock-labs/ledgerclock-engine
          path: ledgerclock-engine
      - uses: actions/checkout@v4
        with:
          repository: ledgerclock-labs/ledgerclock-backend
          path: ledgerclock-backend
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ledgerclock-labs/ledgerclock-frontend
          path: ledgerclock-frontend
      - uses: actions/checkout@v4
        with:
          repository: ledgerclock-labs/ledgerclock-fixtures
          path: ledgerclock-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ledgerclock-*/test.mjs
